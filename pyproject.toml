[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flare-http"
version = "0.1.0"
description = "A calm, beautiful terminal client for HTTP requests, with per-project aliases."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur D'Aquino", email = "arthurdaquinosilva@gmail.com" }]
keywords = ["http", "curl", "rest", "api", "cli", "terminal", "tui", "httpie"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
    "Topic :: Terminals",
]
dependencies = [
    "prompt_toolkit>=3.0.43",
    "rich>=13.8",
    "pygments>=2.15",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest", "pyflakes", "build", "twine"]

[project.urls]
Homepage = "https://github.com/arthurdaquinosilva/flare"
Issues = "https://github.com/arthurdaquinosilva/flare/issues"
Changelog = "https://github.com/arthurdaquinosilva/flare/blob/main/CHANGELOG.md"

[project.scripts]
flare = "flare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
